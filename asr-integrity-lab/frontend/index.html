<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASR Integridad – Búsqueda</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 2rem; }
    input { padding: 0.6rem; width: 280px; }
    button { padding: 0.6rem 1rem; margin-left: 0.5rem; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>ASR Integridad – Búsqueda</h1>
  <p>API_URL: <code id="api"></code></p>
  <input id="q" placeholder="order-1, order-2, ..." />
  <button onclick="run()">Buscar</button>
  <pre id="out"></pre>

  <script>
    const API_URL = localStorage.getItem('api_url') || "https://REEMPLAZA.execute-api.us-east-1.amazonaws.com";
    document.getElementById('api').textContent = API_URL;

    async function run() {
      const q = document.getElementById('q').value;
      const res = await fetch(API_URL + "/search?q=" + encodeURIComponent(q));
      const txt = await res.text();
      document.getElementById('out').textContent = res.status + "\n" + txt;
    }
  </script>
</body>
</html>
